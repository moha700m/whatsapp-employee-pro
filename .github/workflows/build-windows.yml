name: build-windows
on:
  push: { branches: [main] }
  workflow_dispatch:
jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 45
    env: { PYTHONUTF8: "1" }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: { python-version: "3.12", cache: pip }
      - uses: actions/setup-node@v5
        with: { node-version: "22" }
      - name: Engine deps + engine unit tests
        working-directory: engine
        run: |
          npm ci --omit=dev --no-audit --no-fund
          npm test
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller
          python -m playwright install chromium
      - name: Tests
        run: python -m pytest -q
      - name: Build exe (PyInstaller one-folder)
        run: pyinstaller packaging\whatsapp_employee.spec --noconfirm --distpath dist --workpath build
      - name: Bundle Node runtime + engine
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist\WhatsAppEmployee\node | Out-Null
          Copy-Item (Get-Command node).Source dist\WhatsAppEmployee\node\node.exe
          robocopy engine dist\WhatsAppEmployee\engine /E /XD test data /XF *.log | Out-Null
          if (-not (Test-Path dist\WhatsAppEmployee\engine\node_modules\@whiskeysockets\baileys)) { throw "baileys missing" }
          if (-not (Test-Path dist\WhatsAppEmployee\engine\public\fonts\Cairo.ttf)) { throw "font missing" }
          exit 0
      - name: Smoke test built exe
        shell: pwsh
        run: |
          $p = Start-Process -FilePath dist\WhatsAppEmployee\WhatsAppEmployee.exe -ArgumentList "--smoke" -Wait -PassThru
          Get-Content dist\WhatsAppEmployee\data\logs\smoke.txt -ErrorAction SilentlyContinue
          Get-Content dist\WhatsAppEmployee\data\logs\startup.log -ErrorAction SilentlyContinue
          if ($p.ExitCode -ne 0) { throw "smoke failed: $($p.ExitCode)" }
          $r = Start-Process -FilePath dist\WhatsAppEmployee\WhatsAppEmployee.exe -ArgumentList "--qr-test" -Wait -PassThru
          Get-Content dist\WhatsAppEmployee\data\logs\qr-test.txt -ErrorAction SilentlyContinue
          if ($r.ExitCode -ne 0) { Get-Content dist\WhatsAppEmployee\data\logs\startup.log -ErrorAction SilentlyContinue; throw "no real WhatsApp QR within 60s: $($r.ExitCode)" }
          Remove-Item -Recurse -Force dist\WhatsAppEmployee\data -ErrorAction SilentlyContinue
      - name: Installer (Inno Setup)
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" packaging\installer.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed" }
      - name: Installer install / persistence / upgrade / uninstall test
        shell: pwsh
        run: |
          $s = Get-ChildItem dist\WhatsAppEmployee-Setup-*.exe | Select-Object -First 1
          $app = "$env:LOCALAPPDATA\Programs\WhatsAppEmployee"; $exe = "$app\WhatsAppEmployee.exe"; $data = "$env:LOCALAPPDATA\WhatsAppEmployee"
          $p = Start-Process $s.FullName -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES","/NORESTART","/LOG=install.log" -Wait -PassThru
          if ($p.ExitCode -ne 0) { Get-Content install.log; throw "install failed" }
          if (-not (Test-Path $exe)) { throw "exe not installed" }
          $q = Start-Process $exe -ArgumentList "--smoke" -Wait -PassThru
          Get-Content "$app\data\logs\smoke.txt"
          if ($q.ExitCode -ne 0) { Get-Content "$app\data\logs\startup.log" -ErrorAction SilentlyContinue; throw "installed smoke failed" }
          $qr = Start-Process $exe -ArgumentList "--qr-test" -Wait -PassThru
          Get-Content "$app\data\logs\qr-test.txt" -ErrorAction SilentlyContinue
          if ($qr.ExitCode -ne 0) { throw "installed exe: no real WhatsApp QR within 60s" }
          $w = Start-Process $exe -ArgumentList "--persist-test=write" -Wait -PassThru
          if ($w.ExitCode -ne 0) { Get-Content "$app\data\logs\startup.log" -ErrorAction SilentlyContinue; throw "persist write failed" }
          if (-not (Test-Path "$data\wa\store.json")) { throw "user data not in LOCALAPPDATA\WhatsAppEmployee" }
          $c = Start-Process $exe -ArgumentList "--persist-test=check" -Wait -PassThru
          if ($c.ExitCode -ne 0) { throw "close/reopen lost data" }
          $p2 = Start-Process $s.FullName -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES","/NORESTART" -Wait -PassThru
          if ($p2.ExitCode -ne 0) { throw "upgrade-in-place failed" }
          $c2 = Start-Process $exe -ArgumentList "--persist-test=check" -Wait -PassThru
          if ($c2.ExitCode -ne 0) { throw "upgrade lost data" }
          $u = Start-Process "$app\unins000.exe" -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES" -Wait -PassThru
          Start-Sleep 3
          if (Test-Path $exe) { throw "uninstall left exe" }
          if (-not (Test-Path "$data\wa\store.json")) { throw "uninstall deleted user data" }
          $p3 = Start-Process $s.FullName -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES","/NORESTART" -Wait -PassThru
          $c3 = Start-Process $exe -ArgumentList "--persist-test=check" -Wait -PassThru
          if ($c3.ExitCode -ne 0) { throw "reinstall lost data" }
          "install / close-reopen / upgrade / uninstall / reinstall: data kept"
      - name: Zip portable app
        shell: pwsh
        run: Compress-Archive -Path dist\WhatsAppEmployee -DestinationPath dist\WhatsAppEmployee-portable-2.2.1.zip
      - uses: actions/upload-artifact@v7
        with: { name: WhatsAppEmployee-Setup, path: dist/WhatsAppEmployee-Setup-*.exe }
      - uses: actions/upload-artifact@v7
        with: { name: WhatsAppEmployee-portable, path: dist/WhatsAppEmployee-portable-*.zip }
